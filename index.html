/* ================= firebase helpers ================= */
function normalizeCatalog(c) {
    const src = c || {};
    return {
        ...defaultCatalog,
        ...src,
        products: Array.isArray(src.products) ? src.products : [],
        categories: Array.isArray(src.categories) ? src.categories : [],
        coupons: Array.isArray(src.coupons) ? src.coupons : [],
        sliders: Array.isArray(src.sliders) ? src.sliders : [],
        popup: { enabled: false, image: "", link: "", ...(src.popup || {}) },
        paymentNumbers: { ...defaultCatalog.paymentNumbers, ...(src.paymentNumbers || {}) },
        contact: { ...defaultCatalog.contact, ...(src.contact || {}) },
        pages: { ...defaultCatalog.pages, ...(src.pages || {}) },
        emailjs: { ...defaultCatalog.emailjs, ...(src.emailjs || {}) },
        apkUrl: src.apkUrl || "",
    };
}
function watchCatalog(cb, onErr) {
    const ref = db.ref("catalog");
    ref.on("value", (snap) => {
        if (snap.exists())
            cb(normalizeCatalog(snap.val()));
        else {
            ref.set(defaultCatalog);
            cb(defaultCatalog);
        }
    }, (err) => { console.error(err); onErr && onErr(err); });
    return () => ref.off();
}
function saveCatalog(catalog) { return db.ref("catalog").set(catalog); }
function watchOrders(cb, onErr) {
    const ref = db.ref("orders").orderByChild("createdAt");
    ref.on("value", (snap) => {
        const val = snap.val() || {};
        const list = Object.keys(val).map((id) => ({ ...val[id], id })).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
        cb(list);
    }, (err) => { console.error(err); onErr && onErr(err); });
    return () => ref.off();
}
function pushOrder(order) { const ref = db.ref("orders").push(); return ref.set(order).then(() => ref); }
function updateOrderStatus(id, status) { return db.ref("orders/" + id).update({ status }); }
function updateOrder(id, patch) { return db.ref("orders/" + id).update(patch); }

function watchAuth(cb) {
    if (!auth) { cb(null); return () => {}; }
    return auth.onAuthStateChanged((user) => cb(user));
}
function signInWithGoogle() {
    if (!auth) return Promise.reject(new Error("Login system load hoyni. Page reload kore abar try koro."));
    const provider = new firebase.auth.GoogleAuthProvider();
    return auth.signInWithPopup(provider).then((cred) => {
        upsertUserProfile(cred.user, { provider: "google", name: cred.user.displayName, email: cred.user.email });
        return cred;
    });
}
function signOutUser() {
    if (!auth) return Promise.resolve();
    return auth.signOut();
}
function signUpWithPassword(email, phone, password, name) {
    if (!auth) return Promise.reject(new Error("Login system load hoyni. Page reload kore abar try koro."));
    return auth.createUserWithEmailAndPassword(email.trim().toLowerCase(), password).then((cred) => {
        return cred.user.updateProfile({ displayName: name }).then(() => {
            upsertUserProfile(cred.user, { provider: "password", name: name, email: email.trim(), phone: phone.trim() });
            return cred;
        });
    });
}
function signInWithPassword(email, password) {
    if (!auth) return Promise.reject(new Error("লগইন সিস্টেম লোড হয়নি! রিলোড করে আবার চেষ্টা করুন।"));
    return auth.signInWithEmailAndPassword(email.trim().toLowerCase(), password).then((cred) => {
        upsertUserProfile(cred.user, {});
        return cred;
    });
}
function adminSignIn(email, password) {
    if (!auth) return Promise.reject(new Error("লগইন সিস্টেম লোড হয়নি! রিলোড করে আবার চেষ্টা করুন।"));
    return auth.signInWithEmailAndPassword(email.trim().toLowerCase(), password);
}
/* User profile directory in Realtime Database — name/email/phone/join-date only.
   Firebase Auth never exposes plaintext passwords to anyone, including admins —
   they're one-way hashed, so there is nothing to read or show here even in principle. */
function upsertUserProfile(user, extra) {
    if (!user) return Promise.resolve();
    const ref = db.ref("users/" + user.uid);
    const now = new Date().toISOString();
    return ref.once("value").then((snap) => {
        if (snap.exists()) {
            const patch = { lastLoginAt: now };
            if (extra && extra.name) patch.name = extra.name;
            if (extra && extra.email) patch.email = extra.email;
            if (extra && extra.phone) patch.phone = extra.phone;
            return ref.update(patch);
        }
        return ref.set({
            name: (extra && extra.name) || "",
            email: (extra && extra.email) || "",
            phone: (extra && extra.phone) || "",
            provider: (extra && extra.provider) || "password",
            createdAt: now,
            lastLoginAt: now,
        });
    });
}
function watchUsers(cb, onErr) {
    const ref = db.ref("users");
    ref.on("value", (snap) => {
        const val = snap.val() || {};
        const list = Object.keys(val).map((uid) => ({ ...val[uid], uid })).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
        cb(list);
    }, (err) => { console.error(err); onErr && onErr(err); });
    return () => ref.off();
}
function pingAppOpen() {
    try { db.ref("stats/appOpens").transaction((cur) => (cur || 0) + 1); } catch (e) {}
}
function watchReviews(productId, cb, onErr) {
    const ref = db.ref("reviews/" + productId);
    ref.on("value", (snap) => {
        const val = snap.val() || {};
        const list = Object.keys(val).map((id) => ({ ...val[id], id })).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
        cb(list);
    }, (err) => { console.error(err); onErr && onErr(err); });
    return () => ref.off();
}
function submitReview(productId, review) {
    const ref = db.ref("reviews/" + productId).push();
    return ref.set(review);
}
function deleteReview(productId, reviewId) {
    return db.ref("reviews/" + productId + "/" + reviewId).remove();
}
function sendOrderEmails(order, catalog) {
    const cfg = catalog.emailjs || {};
    if (!cfg.serviceId || !cfg.templateId || !cfg.publicKey || typeof emailjs === "undefined") return;
    const itemsText = (order.items || []).map((i) => i.name + (i.size ? " (" + i.size + ")" : "") + " x" + i.qty).join(", ");
    const baseParams = {
        shop_name: catalog.shopName,
        order_id: (order.__id || "").slice(-6).toUpperCase(),
        customer_name: order.customer.name,
        customer_phone: order.customer.phone,
        customer_address: [order.customer.thana, order.customer.district].filter(Boolean).join(", ") + " \u2014 " + order.customer.address,
        items: itemsText,
        total: "\u09F3 " + order.grandTotal,
        payment_method: order.paymentMethod,
    };
    const recipients = [];
    if (cfg.adminEmail) recipients.push(cfg.adminEmail);
    if (order.customer.email) recipients.push(order.customer.email);
    recipients.forEach((to) => {
        emailjs.send(cfg.serviceId, cfg.templateId, { ...baseParams, to_email: to }, cfg.publicKey).catch((err) => console.error("EmailJS error:", err));
    });

            else field += c;

            if (c === '"') inQuotes = true;
